# =============================================================================
# PA-SHOULDER-RCR-001
# Rotator cuff repair
# =============================================================================
# Logical shape: CONJUNCTIVE (all_of) with an age/tear-type dependent waiver.
#
# Why this policy is in the corpus: it is the DISTRACTOR ENGINE. Its cohort
# (rotator cuff injury, 12 patients) overlaps heavily with patients who also have
# physical therapy careplans for ankle or wrist sprains. A verifier answering
# "was six weeks of physical therapy completed?" must check WHICH JOINT the
# therapy addressed. Seed patient df7c1d66 has two PT careplans, one for a knee
# meniscus tear and one for a wrist sprain, and is the canonical distractor case.
# =============================================================================

policy_id: PA-SHOULDER-RCR-001
version: 1.0.0
title: Rotator cuff repair, arthroscopic or open
specialty: orthopedics
logic: all_of
tier: 1

provenance:
  derived_from: >
    Composed for this corpus from criteria conventional across commercial
    musculoskeletal surgical policy, structurally consistent with Aetna's
    musculoskeletal Clinical Policy Bulletins.
  relationship: original prose, clinically conventional criteria
  retrieved: 2026-08-30

requested_service:
  description: Rotator cuff repair
  synthea_proxy:
    description: Surgical manipulation of shoulder joint
    note: Only 2 rows in synthea_data/procedures.csv. Cohort is small.

cohort_grounding:
  condition: Injury of tendon of the rotator cuff of shoulder
  patients: 12
  pt_careplans_with_this_reason: 12
  source: synthea_data/careplans.csv

criteria:

  - id: C1_symptoms_and_exam
    text: >
      Shoulder pain with objective loss of strength or range of motion on
      examination, or a positive provocative impingement or cuff-integrity manoeuvre.
    type: clinical_finding
    required: true
    evidence:
      accepts: [clinician_narrative]
    failure_modes:
      missing: pain documented with no shoulder examination recorded
      contradicted: examination documents full strength and range of motion

  - id: C2_imaging_confirmation
    text: >
      Imaging confirmation of a rotator cuff tear by MRI, MR arthrography, or
      diagnostic ultrasound.
    type: imaging
    required: true
    evidence:
      accepts: [mri_report, ultrasound_report]
      modality_rules:
        rotator_cuff_tear: [mri, ultrasound]
    failure_modes:
      missing: tear suspected clinically with no imaging report on file
      contradicted: imaging describes an intact cuff or tendinosis without tear
    notes: >
      Plain radiography does NOT satisfy this criterion. Note the contrast with
      PA-KNEE-ARTHRO-001 C3, where X-ray IS sufficient for loose bodies. Modality
      sufficiency is policy-specific and criterion-specific.

  - id: C3_conservative_therapy
    text: >
      At least six weeks of conservative management directed at the affected
      shoulder, comprising physical therapy and pharmacotherapy, without adequate
      improvement.
    type: therapy_trial
    required: true
    threshold:
      duration_days: 42
      comparator: ">="
    modality_required: any
    lookback_days: 365
    body_region_must_match: shoulder      # <-- the distractor guard
    evidence:
      accepts_either: [physical_therapy_notes, member_claims_history]
    waived_if: W1_acute_traumatic_full_thickness
    failure_modes:
      missing: therapy documented without duration
      contradicted: documented duration shorter than 42 days, or improvement documented
      trap_distractor: >
        THE PRIMARY TRAP FOR THIS POLICY. Qualifying physical therapy is documented,
        but for a different body region. In synthea_data/careplans.csv, PT careplans
        are dominated by ankle sprain (134) and wrist sprain (56), so an
        unrelated-region PT episode is the statistically likely thing a naive
        retriever will find first.
      trap_temporal: qualifying shoulder therapy completed more than 12 months earlier

waivers:
  - id: W1_acute_traumatic_full_thickness
    text: >
      The conservative management requirement does not apply to an acute traumatic
      full-thickness tear in a patient for whom early repair is indicated.
    waives: [C3_conservative_therapy]
    logic: all_of
    conditions:
      - acute_traumatic_mechanism
      - full_thickness_tear_on_imaging
    evidence:
      accepts: [clinician_narrative, mri_report]
    failure_modes:
      trap_partial_waiver: >
        Imaging describes a partial-thickness tear, or the mechanism is degenerative
        rather than traumatic. Either alone means the waiver must NOT fire. Both
        conditions are required.

exclusions:
  - id: X1_irreparable_cuff
    text: >
      Repair is not covered where imaging demonstrates an irreparable tear with
      established fatty atrophy and fixed superior migration of the humeral head.

# Framework-neutral. See PA-KNEE-ARTHRO-001 for the full projection table.
criteria_logic:
  all_met_if: >
    every criterion is SUPPORTED after applying any firing waiver, and no exclusion
    applies
  fails_if: any criterion is CONTRADICTED, or an exclusion applies
  indeterminate_if: any criterion is MISSING and none is CONTRADICTED
  projections:
    provider_side: {all_met: READY_FOR_SUBMISSION, indeterminate: NOT_READY, fails: REVIEW_NEEDED}
    payer_side: {all_met: APPROVE, indeterminate: PEND, fails: DENY}
