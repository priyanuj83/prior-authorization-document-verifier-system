partially_available:

  conservative_therapy_definition:
    note: >
      This policy defines conservative therapy as activity modification, analgesics,
      NSAIDs and muscle relaxants, and does NOT require physical therapy. The
      medication components ARE present in the extract.
    grounded_medications:
      - description: Naproxen sodium 220 MG Oral Tablet
        rows: 276
      - description: Ibuprofen 200 MG Oral Tablet
        rows: 188
      - description: Acetaminophen 325 MG Oral Tablet
        rows: 644
    consequence: >
      If you take remediation option B, the NSAID and analgesic arm of the
      conservative-therapy criterion can be grounded immediately from medications.csv
      without any new module work.

  trauma_branches:
    note: >
      Branches B8 and B9 concern suspected spinal fracture and cord injury. The two
      existing vertebral fracture rows could seed a very small B8/B9 series.
    patients: 2
    recommendation: too few for a case series, adequate for a single fixture
