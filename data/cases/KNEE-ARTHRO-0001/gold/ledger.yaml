# =============================================================================
# EVIDENCE LEDGER: KNEE-ARTHRO-0001
# =============================================================================
# The ledger is the CANONICAL TRUTH for this case. Everything that is true about
# this patient in this episode is here, and nothing that is not here is true.
#
# Why it exists: once the note generator authors facts that Synthea does not
# contain (symptom phenomenology, imaging grades, therapy modality), the Synthea
# timeline is no longer the ground truth. The ledger is the union of Synthea events
# and authored events.
#
#   ledger        = authoritative facts, each with a stable id
#   notes/*.md    = a deliberately LOSSY, OBFUSCATED rendering of the ledger
#   labels.yaml   = computed against the LEDGER, never against the notes
#
# The gap between the ledger and the notes IS the task difficulty.
# The verifier sees only the notes and pa_form.yaml. Never this file.
# =============================================================================

