# -----------------------------------------------------------------------------
# PACKET SCOPE
# -----------------------------------------------------------------------------
# This case is an EVIDENCE PACKET for one prior authorisation episode. It is NOT
# the patient's complete chart. Recording what was excluded, and why, is what makes
# the packet auditable: a reviewer can tell the difference between a fact the
# generator forgot and a fact the generator deliberately withheld.
# -----------------------------------------------------------------------------

scope:
  episode_window:
    start: 2014-01-31
    end: 2014-04-16
  therapy_lookback_window:
    start: 2013-04-16
    end: 2014-04-16
    applies_to: [C4_conservative_therapy]
    note: >
      The 365-day lookback is a property of C4 specifically, not of the packet. Other
      criteria have no lookback and may legitimately rely on older evidence.

  patient_chart_totals:
    conditions_lifetime: 4
    encounters_lifetime: 8
    observations_lifetime: 89
    careplans_lifetime: 1
    note: >
      This patient is a genuinely light utiliser. His entire lifetime chart is the
      knee episode plus three viral sinusitis visits, so episode scoping excludes
      almost nothing here. Contrast KNEE-ARTHRO-0003, whose patient has 12 conditions
      and 247 observations.

  excluded_from_packet:
    - date: 2013-10-06
      description: Viral sinusitis (disorder)
      in_therapy_lookback: true
      reason: clinically unrelated to the knee episode
    - date: 2012-06-20
      description: Viral sinusitis (disorder)
      in_therapy_lookback: false
      reason: outside lookback and clinically unrelated
    - date: 2019-07-19
      description: Viral sinusitis (disorder)
      in_therapy_lookback: false
      reason: >
        POST-DATES THE REQUEST. Must never appear in the packet. Leaking
        post-request events is the most damaging possible scoping bug, because it
        gives the verifier information the real reviewer could not have had.

  distractor_content:
    present: false
    known_limitation: >
      Every document in this packet is relevant to the request. Real charts are mostly
      noise, and locating the therapy discharge summary among dozens of irrelevant
      documents is a substantial part of the real task. As it stands this case measures
      verification but barely measures retrieval.
      This patient has almost no unrelated history to draw on, so adding realistic
      distractors here would mean authoring them. KNEE-ARTHRO-0002 and -0003 have
      genuine in-window unrelated history and are the better places to add distractor
      documents first.

