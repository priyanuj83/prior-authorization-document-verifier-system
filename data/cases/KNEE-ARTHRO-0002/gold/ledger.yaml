# -----------------------------------------------------------------------------
# TWO-COLUMN CRITERION TRUTH TABLE
# -----------------------------------------------------------------------------
# clinical_truth      - what is actually so, per the full ledger
# documentation_state - what the ENCLOSED RECORD establishes
#
# labels.yaml follows documentation_state.
# -----------------------------------------------------------------------------

criterion_truth:

  C1_symptoms:
    clinical_truth: MET
    documentation_state: ESTABLISHED
    basis: [A002]
    label_follows: SUPPORTED

  C2_oa_severity:
    clinical_truth: MET
    documentation_state: ESTABLISHED
    basis: [A004]
    label_follows: SUPPORTED

  C3_radiologic_confirmation:
    clinical_truth: NOT_MET
    documentation_state: SILENT
    basis: [A007, A004]
    label_follows: MISSING
    detail: >
      No MRI exists, so the criterion is genuinely unmet. But the record does not
      affirmatively demonstrate an intact meniscus either; it simply lacks the
      required study. Silence, not contradiction.

  C4_conservative_therapy:
    clinical_truth: NOT_MET
    documentation_state: SILENT
    basis: [E004, E005, A005]
    label_follows: MISSING
    detail: >
      THE CENTRAL CASE OF THE DIVERGENCE. Clinically the course was 30 days and
      home-based, failing on both duration and modality. Documentarily, no duration or
      modality reaches the enclosed record at all, so the reviewer cannot establish
      either way. The correct verdict on the submission is MISSING.
      Had the therapy discharge summary been enclosed stating 30 days, the same
      clinical facts would yield CONTRADICTED. That contrast is worth generating as a
      variant case later.

  W1_locked_knee:
    clinical_truth: NOT_APPLICABLE
    documentation_state: NOT_ESTABLISHED
    basis: [A003, A007]
    label_follows: NOT_FIRED
    detail: >
      Requires true locking AND a displaced bucket-handle tear. A003 is a transient
      self-resolving episode, not true locking. A007 records that no MRI exists, so
      tear morphology is entirely unknown. Neither condition is established, let alone
      both.

  exclusions:
    X1_diagnostic_only:
      state: ARGUABLY_TRIGGERED
      detail: >
        The exclusion bars arthroscopy without radiologically proven pathology, and
        pathology is not radiologically proven here. Treated as subsumed by the C3
        MISSING verdict rather than scored as an independent exclusion, because
        pending on C3 is the correct real-world action and denying outright on X1
        would be unreasonable when an MRI could still be obtained.
        Flagged here because it is a genuine ambiguity a reviewer of this corpus
        should be aware of.
    X2_meniscal_root_tear:
      state: NOT_TRIGGERED
      detail: Cannot be assessed without an MRI, but nothing suggests a root tear.
