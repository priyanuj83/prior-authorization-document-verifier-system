  plan_id: MEDICARE-FFS-01
  requires_prior_auth: false
  requires_coverage_review: true
  gate_expected: COVERAGE_REVIEW_REQUIRED
  governing_policy: PA-KNEE-ARTHRO-001
  trap_note: >
    requires_prior_auth is FALSE. A verifier keying only on that field returns
