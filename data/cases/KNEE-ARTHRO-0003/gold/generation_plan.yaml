# =============================================================================
# GENERATION PLAN: KNEE-ARTHRO-0003
# =============================================================================
# Intended labels are INPUTS to generation, never outputs.
#
# THIS CASE HAS THREE INDEPENDENT JOBS:
#
#   1. THREE OF FOUR CRITERIA PASS. Only C2 fails, and it fails hard. A verifier
#      that approves on majority satisfaction, or that weights criteria by how much
#      supporting text it found, will approve this and be wrong. Denial here rests
#      on a single criterion, which is how real denials work.
#
#   2. IT ROUTES THROUGH MEDICARE-FFS-01, where requires_prior_auth is FALSE but
#      requires_coverage_review is TRUE. A verifier that collapses those two fields
#      will return NO_AUTH_REQUIRED and skip verification entirely, missing the only
#      case in the corpus where the patient substantively fails the policy.
#
#   3. IT IS A CROSS-POLICY INVERSION. The same radiology report that CONTRADICTS
#      PA-KNEE-ARTHRO-001 C2 SUPPORTS PA-TKA-001 C1, because arthroscopy requires
#      mild osteoarthritis and arthroplasty requires advanced osteoarthritis. Reuse
#      this ledger against PA-TKA-001 to get a free inverted label pair. This is
#      what stops a verifier learning that "severe osteoarthritis" is generically
#      disqualifying.
# =============================================================================

