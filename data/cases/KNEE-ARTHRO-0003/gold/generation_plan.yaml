# -----------------------------------------------------------------------------
# INTENDED LABELS
# -----------------------------------------------------------------------------
intended_documentation_status: REVIEW_NEEDED
intended_remediable: false
intended_payer_view: DENY             # derived, not scored

criteria:

  - id: C1_symptoms
    intended_label: SUPPORTED
    realization: narrative_plain
    directive: >
      Document knee pain and clear mechanical catching. Keep it unambiguous. The case
      must fail on C2 alone, so every other criterion should be comfortably satisfied.

  - id: C2_oa_severity
    intended_label: CONTRADICTED
    realization: radiology_grade_exceeds_threshold
    directive: >
      The plain film report states severe tricompartmental degenerative change,
      Kellgren-Lawrence grade 4, with bone-on-bone contact medially. The MRI
      corroborates it independently with full-thickness cartilage loss.
    grounding: >
      Not invented arbitrarily. This patient carries an Osteoarthritis of knee
      diagnosis (SNOMED 239873007) with onset 1986-06-14, so 28 years of documented
      disease at the time of the episode, plus a Musculoskeletal care careplan open
      since 1986 for the same reason. She is 67. Grade 4 follows directly from the
      grounding heuristic in grounding/PA-KNEE-ARTHRO-001.yaml.
    why_contradicted_not_missing: >
      The record affirmatively demonstrates the criterion is NOT met. A grade is stated
      explicitly and it exceeds the allowed maximum. This is not silence, it is
      positive evidence against.
    forbidden_vocabulary: [criterion, policy, not medically necessary]

  - id: C3_radiologic_confirmation
    intended_label: SUPPORTED
    realization: authored_mri_report
    directive: >
      Author an MRI confirming a degenerative tear of the posterior horn of the medial
      meniscus. The tear is real and confirmed. Do not let this criterion fail.
    note: >
      Deliberately SUPPORTED. If C3 also failed, the case would not isolate the
      osteoarthritis judgement, and a verifier could fail the case for the wrong reason.

  - id: C4_conservative_therapy
    intended_label: SUPPORTED
    realization: multi_hop_across_two_notes
    directive: >
      60 days of supervised in-person therapy, dates split across the ED note and the
      therapy discharge summary exactly as in KNEE-ARTHRO-0001. Establish in-person
      modality through setting rather than by using the phrase.
    note: >
      Also deliberately SUPPORTED, and deliberately the HARDEST criterion in the case
      to verify. A verifier that expends its effort on C4 and then treats the
      osteoarthritis grade as background detail will approve. Difficulty is
      concentrated on a criterion that passes, so that attention is drawn away from
      the one that fails.
    forbidden_vocabulary:
      - conservative therapy
      - conservative management
      - six weeks
      - 6 weeks
      - in-person

waivers:
  - id: W1_locked_knee
    intended_state: NOT_FIRED
    directive: >
      No true locking and no bucket-handle tear. Note that even if this waiver DID
      fire it would only waive C4, which already passes. It cannot rescue C2.
      Worth including precisely because it is a dead end: a verifier that reaches for
      a waiver to resolve a denial should find that waivers do not work that way.

attestations:
  - id: AT2
    intended_verdict: CONTRADICTED
    realization: form_understates_severity
    directive: >
      The form attests to "mild degenerative change of the affected knee". The
      enclosed radiology report says grade 4 with bone-on-bone contact. This is a
      direct numeric and descriptive conflict between the form and its own enclosure.
    why_it_matters: >
      This is the cleanest contradiction in the corpus. No clinical judgement is
      required to see it, only a comparison between two documents in the same
      envelope. If a verifier cannot catch this, it cannot catch anything harder.

# -----------------------------------------------------------------------------
# DIFFICULTY
# -----------------------------------------------------------------------------
difficulty:
  overall: high
  drivers:
    - denial rests on one criterion while three others pass
    - the policy resolution step can be failed before verification even begins
    - verification effort is concentrated on a criterion that passes
    - the form directly understates a value stated in its own enclosure
  purpose: >
    Tests whether the verifier evaluates criteria conjunctively rather than
    additively, and whether it resolves the policy correctly. Also the corpus's only
    non-remediable case, so it is the sole measure of whether the system can tell a
    provider "no amount of paperwork fixes this" rather than sending them on a
    document hunt that cannot succeed.

reuse:
  - policy: PA-TKA-001
    expected_outcome: >
      C1_advanced_oa becomes SUPPORTED on the same radiology report. Generate as a
      separate case reusing this ledger to obtain the inverted pair.
  - policy: PA-KNEE-MRI-001
    expected_outcome: >
      Exclusion X1_advanced_oa_only is triggered, so the April MRI would itself have
      been deniable. Useful for a chained-request case where the upstream imaging
      authorisation should have been refused.
