# -----------------------------------------------------------------------------
# PACKET SCOPE
# -----------------------------------------------------------------------------
# An evidence packet for one episode, not the patient's complete chart.
#
# This case demonstrates why the lookback window is PER-CRITERION and not global:
# the knee osteoarthritis diagnosis from 1986 sits far outside any lookback, yet it
# is essential evidence and IS rendered. A packet builder that applied a single
# 365-day window to everything would discard the fact that decides the case.
# -----------------------------------------------------------------------------

scope:
  episode_window:
    start: 2014-01-31
    end: 2014-04-22
  therapy_lookback_window:
    start: 2013-04-22
    end: 2014-04-22
    applies_to: [C4_conservative_therapy]
    note: >
      Applies ONLY to the therapy trial criterion. C2_oa_severity has no lookback and
      properly relies on a 1986 diagnosis plus 2014 imaging.

  included_outside_lookback:
    - date: 1986-06-14
      description: Osteoarthritis of knee
      reason: >
        Twenty-eight years outside the therapy lookback, and indispensable. It is the
        basis for the grade 4 finding that CONTRADICTS C2 and therefore decides the
        case. Deliberately rendered.
    - date: 1986-06-14
      description: Musculoskeletal care careplan, still open
      reason: corroborates the duration and continuity of the osteoarthritis

  patient_chart_totals:
    conditions_lifetime: 12
    encounters_lifetime: 26
    observations_lifetime: 247
    careplans_lifetime: 5
    note: >
      A moderate utiliser. Roughly three times the chart volume of KNEE-ARTHRO-0001,
      which is why scoping actually does work here.

  excluded_from_packet:
    - date: 2013-09-29
      description: Viral sinusitis (disorder)
      in_therapy_lookback: true
      reason: clinically unrelated
      distractor_candidate: true
    - date: 2010-12-11
      description: Acute bronchitis, with a respiratory therapy careplan to 2011-09-19
      in_therapy_lookback: false
      reason: clinically unrelated
      distractor_candidate: true
      note: >
        A completed therapy careplan of a DIFFERENT kind, well outside the lookback.
        Strong distractor material for C4: a verifier searching for "therapy" would
        find a real 282-day course that has nothing to do with the knee.
    - date: 2006-08-21
      description: Osteoporosis (disorder)
      in_therapy_lookback: false
      reason: >
        Not relevant to this arthroscopy request, but IS relevant if this ledger is
        reused against PA-TKA-001. Retain when generating that variant.
    - date: 1980-09-08
      description: Prediabetes, with an open diabetes self-management careplan
      in_therapy_lookback: false
      reason: clinically unrelated to the knee
    - date: 1983-02-19
      description: Chronic sinusitis (disorder)
      in_therapy_lookback: false
      reason: clinically unrelated

  excluded_because_post_request:
    note: >
      ALL of the following post-date the 2014-04-22 request and must never appear in
      the packet under any circumstances.
    events:
      - date: 2016-06-19
        description: Polyp of colon
      - date: 2016-12-16
        description: Fracture subluxation of wrist
      - date: 2016-12-16
        description: Pathological fracture due to osteoporosis (disorder)
      - date: 2016-12-16
        description: Fracture care careplan, to 2017-02-14
        hazard: >
          HIGHEST-RISK LEAK IN THIS CASE. A completed 60-day careplan. If it leaked
          into the packet, a verifier could satisfy C4 from an unrelated body region
          two years after the request. It happens to have the same duration as the
          real knee therapy course, so the leak would be invisible in the label.
      - date: 2017-09-23
        description: Viral sinusitis (disorder)
      - date: 2017-10-01
        description: Streptococcal sore throat (disorder)

  distractor_content:
    present: false
    best_available_material: >
      The 2013 sinusitis visit sits inside the therapy lookback, and the 2010 to 2011
      respiratory therapy careplan is a genuine completed therapy course of the wrong
      type. Together they are the strongest authentic distractor material in the
      corpus, and neither requires invention.

