# -----------------------------------------------------------------------------
# CRITERION TRUTH TABLE
# -----------------------------------------------------------------------------
# Clinical truth and documentation state agree throughout this case.
# -----------------------------------------------------------------------------

criterion_truth:

  C1_symptoms:
    clinical_truth: MET
    documentation_state: ESTABLISHED
    basis: [A002]
    label_follows: SUPPORTED

  C2_oa_severity:
    clinical_truth: NOT_MET
    documentation_state: AFFIRMATIVELY_DEMONSTRATED_UNMET
    basis: [A003, A004, E001, E002]
    label_follows: CONTRADICTED
    detail: >
      Kellgren-Lawrence grade 4 exceeds the grade 0-2 maximum. Stated explicitly on
      plain film, independently corroborated on MRI as Outerbridge grade 4, and
      structurally consistent with 28 years of documented disease. This is positive
      evidence against the criterion, which is what distinguishes CONTRADICTED from
      MISSING.

  C3_radiologic_confirmation:
    clinical_truth: MET
    documentation_state: ESTABLISHED
    basis: [A004]
    label_follows: SUPPORTED
    detail: MRI confirms the meniscal tear. Correct modality for this pathology.

  C4_conservative_therapy:
    clinical_truth: MET
    documentation_state: ESTABLISHED
    basis: [E006, E007, A005]
    label_follows: SUPPORTED
    detail: >
      60 days of supervised in-person outpatient therapy for the left knee, completed
      2014-04-01, which is 21 days before the request and inside the 365-day lookback.

  W1_locked_knee:
    clinical_truth: NOT_APPLICABLE
    documentation_state: NOT_ESTABLISHED
    basis: [A002, A004]
    label_follows: NOT_FIRED
    detail: >
      Catching without true locking, and A004 excludes a bucket-handle configuration.
      Note that firing this waiver could not change the outcome, since it waives only
      C4, which already passes. Waivers cannot rescue a contradicted criterion.

  exclusions:
    X1_diagnostic_only:
      state: NOT_TRIGGERED
      detail: Pathology is radiologically proven.
    X2_meniscal_root_tear:
      state: NOT_TRIGGERED
      detail: >
        Meniscal extrusion is present but the tear is described as posterior horn
        rather than root. Deliberately kept clear of the root-tear exclusion so the
        denial rests solely on C2.

# -----------------------------------------------------------------------------
# CROSS-POLICY REUSE
# -----------------------------------------------------------------------------

cross_policy:

  PA-TKA-001:
    C1_advanced_oa:
      label_would_be: SUPPORTED
      basis: [A003, A004]
      detail: >
        Requires Kellgren-Lawrence grade 3 or more. Grade 4 satisfies it. The SAME
        radiology report that contradicts PA-KNEE-ARTHRO-001 C2 supports this one.
    C3_conservative_management:
      label_would_be: CONTRADICTED
      basis: [E006, E007]
      detail: >
        Requires 90 days. The documented course is 60 days, which affirmatively falls
        short. A second inversion: the same therapy episode that SUPPORTS the
        arthroscopy criterion at a 42-day threshold CONTRADICTS the arthroplasty
        criterion at a 90-day threshold.
    value: >
      Generating this ledger against PA-TKA-001 yields a case where two criteria flip
      label in opposite directions purely because the policy changed. No corpus of
      single-policy cases can produce that, and it is the strongest available evidence
      of whether a verifier is reading thresholds or reciting them.

  PA-KNEE-MRI-001:
    X1_advanced_oa_only:
      state_would_be: TRIGGERED
      detail: >
        The April MRI would itself have been deniable, since plain films already
        demonstrated advanced disease sufficient to explain the symptoms. Usable for a
        chained-request case in which an upstream imaging authorisation should have
        been refused.
